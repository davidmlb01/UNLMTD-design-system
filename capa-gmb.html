    function loadImg(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }

    function draw(wm) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);

      // Linha 1
      ctx.fillStyle = CREAM;
      ctx.font = 'italic 300 112px "Cormorant Garamond", Georgia, serif';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('We are shapeless.', W / 2, H / 2 - 22);

      // Linha 2
      ctx.font = 'italic 300 112px "Cormorant Garamond", Georgia, serif';
      ctx.fillText('We are UNLMTD.', W / 2, H / 2 + 112);

      // Wordmark pequeno embaixo direita
      const wmW = 160;
      const wmH = (wm.naturalHeight / wm.naturalWidth) * wmW;
      ctx.drawImage(wm, W - wmW - 56, H - wmH - 44, wmW, wmH);

      status.textContent = 'Pronto.';
    }

    // Espera fonte carregar antes de renderizar
    document.fonts.ready.then(() => {
      loadImg(WM_SRC).then(wm => draw(wm));
    });

    btn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'UNLMTD-capa-GMB-1332x750.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      status.textContent = 'PNG baixado.';
    });
  </script>
